  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

    color:var(--paper);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 16px 48px;
  }

  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
    border-radius:6px;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .scrim{
    position:absolute;
    top:0; right:0; bottom:0; left:0;
    background:linear-gradient(175deg,
      rgba(80,10,50,.4) 0%,
      rgba(21,9,16,.5) 18%,
      rgba(21,9,16,.62) 45%,
      rgba(21,9,16,.78) 70%,
      rgba(21,9,16,.9) 100%);
  }

  .content{
    position:relative;
    z-index:1;
    padding:52px 24px 34px;
    text-align:center;
  }

  .name{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(30px, 8vw, 36px);
    line-height:1.05;
    margin:0 0 8px;
    color:var(--paper);
    text-shadow:0 6px 22px rgba(0,0,0,.6);
  }

  .title{
    font-size:14.5px;
    line-height:1.5;
    color:var(--blush);
    margin:0 auto;
    max-width:300px;
    font-weight:500;
    text-shadow:0 3px 14px rgba(0,0,0,.6);
  }

  .org{
    display:inline-block;
    margin-top:12px;
    font-size:12.5px;
    letter-spacing:.03em;
    color:var(--gold);
    font-weight:700;
    padding:5px 14px;
    border:1px solid rgba(232,196,104,.55);
    border-radius:999px;
    background:rgba(21,9,16,.4);
    backdrop-filter:blur(4px);
  }

  .divider{
    height:1px;
    margin:26px 8px 22px;
    background:linear-gradient(90deg, transparent, rgba(255,214,229,.35), transparent);
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    background:linear-gradient(115deg, var(--gold-soft), var(--hot-pink) 65%);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    box-shadow:0 14px 30px -10px rgba(255,46,147,.6);
    border:none;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }

  .cta:hover{transform:translateY(-2px); box-shadow:0 18px 34px -8px rgba(255,46,147,.7);}
  .cta:active{transform:translateY(0);}
  .cta svg{width:19px; height:19px; flex:none;}

  .cta-hint{
    text-align:center;
    font-size:11.5px;
    color:rgba(255,214,229,.6);
    margin:10px 0 0;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    padding:26px 0 4px;
  }

  .action{
    width:78px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }

  .action .icon{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,214,229,.1);
    border:1px solid rgba(255,214,229,.22);
    backdrop-filter:blur(6px);
    transition:background .18s ease, transform .18s ease, border-color .18s ease;
  }

  .action .icon svg{width:22px; height:22px; stroke:var(--blush); fill:none;}

  .action:hover .icon{
    background:rgba(255,46,147,.2);
    border-color:rgba(255,46,147,.5);
    transform:translateY(-2px);
  }

  .action span{
    font-size:11.5px;
    color:rgba(255,246,250,.85);
    font-weight:600;
  }

  .footer{
    text-align:center;
    padding:22px 0 0;
    font-size:11.5px;
    color:rgba(255,214,229,.5);
    letter-spacing:.02em;
  }

  @media (max-width:340px){
    .action{width:70px;}
    .action .icon{width:48px; height:48px;}
  }
</style>
